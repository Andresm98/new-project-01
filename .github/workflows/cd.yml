name: CD - Deploy np01 to EC2

# Runs when CI finishes on main. CI only succeeds on main after the
# "ci-approval" review and the GHCR publish, so this deploys an approved,
# scanned release (sha-<commit>).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-np01-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 over SSH
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_SSH_USER: ec2-user
      DEPLOY_DIR: /opt/np01
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate deployment target and resolve release
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Add EC2_HOST as a GitHub Actions repository variable}"
          # Same tag that CI's publish job pushed.
          echo "IMAGE_TAG=sha-${HEAD_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Verify GHCR images are anonymously pullable
        shell: bash
        run: |
          set -euo pipefail
          for image in backend frontend; do
            if ! docker manifest inspect "${IMAGE_PREFIX}/${image}:${IMAGE_TAG}" >/dev/null; then
              echo "::error::Cannot pull ${IMAGE_PREFIX}/${image}:${IMAGE_TAG} anonymously. Confirm the GHCR package is public."
              exit 1
            fi
          done

      - name: Prepare SSH key and known hosts
        id: ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ec2-deploy-key"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          echo "key-file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Check EC2 sudo and Docker Compose prerequisites
        env:
          SSH_KEY_FILE: ${{ steps.ssh.outputs.key-file }}
        run: |
          remote_check="sudo -n true || { echo 'ec2-user needs passwordless sudo' >&2; exit 20; }; \
            sudo -n sh -c \"command -v docker >/dev/null || { echo 'Docker is not installed' >&2; exit 21; }; \
            docker compose version || { echo 'Docker Compose plugin is unavailable' >&2; exit 22; }; \
            install -d -m 755 ${DEPLOY_DIR}\""
          ssh -i "$SSH_KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${EC2_SSH_USER}@${EC2_HOST}" "$remote_check"

      # Bundle: compose + observability config + .env.example (template only:
      # the production .env lives on the VM and CD never overwrites it).
      - name: Copy release bundle and deploy script to EC2
        env:
          SSH_KEY_FILE: ${{ steps.ssh.outputs.key-file }}
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/np01-bundle.tgz" docker-compose.yml .env.example observability
          scp -i "$SSH_KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/np01-bundle.tgz" \
            deploy/deploy-ec2.sh \
            "${EC2_SSH_USER}@${EC2_HOST}:/tmp/"

      - name: Deploy the pinned release
        env:
          SSH_KEY_FILE: ${{ steps.ssh.outputs.key-file }}
        shell: bash
        run: |
          set -euo pipefail
          remote_command="sudo -n env \
            IMAGE_PREFIX='$IMAGE_PREFIX' \
            IMAGE_TAG='$IMAGE_TAG' \
            DEPLOY_DIR='$DEPLOY_DIR' \
            BUNDLE=/tmp/np01-bundle.tgz \
            bash /tmp/deploy-ec2.sh"

          ssh -i "$SSH_KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${EC2_SSH_USER}@${EC2_HOST}" "$remote_command"
          {
            echo "### Deployed to EC2"
            echo "- \`${IMAGE_PREFIX}/backend:${IMAGE_TAG}\`"
            echo "- \`${IMAGE_PREFIX}/frontend:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f "${{ steps.ssh.outputs.key-file }}"
